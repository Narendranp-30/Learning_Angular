<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Http Req, Res</title>
    <!-- Bootstrap 5 CDN -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
</head>
<body class="bg-light p-4">

    <div class="container">
        <h1 class="mb-4">HTTP Request / Response</h1>

        <form (submit)="submitPost()" class="mb-4 p-3 border rounded bg-white shadow-sm">
            <div class="mb-3">
                <input type="text" class="form-control" [(ngModel)]="newPost.title" placeholder="Title" name="title">
            </div>
            <div class="mb-3">
                <input type="text" class="form-control"[(ngModel)]="newPost.body" placeholder="Body" name="body">
            </div>
            <button type="submit" class="btn btn-primary">Create</button>
        </form>

        <ul *ngIf="posts.length > 0; else loading" class="list-group">
            <li *ngFor="let post of posts" class="list-group-item d-flex justify-content-between align-items-center">
                <div *ngIf="editingPost?.id !== post.id">
                    <strong>{{post.title}}</strong>
                    <div class="text-muted small">{{post.body}}</div>
                </div>
                <ng-container *ngIf="editingPost && editingPost.id === post.id">
                    <input type="text" [(ngModel)]="editingPost.title" class="form-control mb-1" />
                    <input type="text" [(ngModel)]="editingPost.body" class="form-control mb-1" />
                    <button class="btn btn-sm btn-success me-2" (click)="updatePost()">Save</button>
                    <button class="btn btn-sm btn-secondary" (click)="editingPost = null">Cancel</button>
                </ng-container>
                <div *ngIf="editingPost?.id !== post.id">
                    <button class="btn btn-sm btn-warning me-2" (click)="edit(post)">Edit</button>
                    <button class="btn btn-sm btn-danger" (click)="deletePost(post.id)">Delete</button>
                </div>
            </li>
        </ul>
        <ng-template #loading>Loading Posts.....</ng-template>
    </div>

</body>
</html>
